name: varejomix
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: varejomix
      POSTGRES_USER: varejomix
      POSTGRES_PASSWORD: varejomix
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql/03_analytics.sql:/docker-entrypoint-initdb.d/03_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varejomix -d varejomix"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: varejomix_events
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./nosql/01-mongo-init.js:/docker-entrypoint-initdb.d/01-mongo-init.js:ro
      - ./nosql/02-eventos-sinteticos.js:/docker-entrypoint-initdb.d/02-eventos-sinteticos.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  mongodb_data:


